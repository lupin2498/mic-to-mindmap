name: Tests (pytest + Playwright)

on:
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - "tests/**"
      - "mobile/build-web.js"
      - "mobile/capacitor.config.json"
      - "mobile/android/app/src/**"
      - "mobile/ios/App/App/**"
      - "mobile/ios/App/App.xcodeproj/project.pbxproj"
      - "requirements*.txt"
      - ".github/workflows/tests.yml"
  workflow_dispatch:
    inputs:
      grep:
        description: "Chỉ chạy các bước E2E có tên chứa chuỗi này (bỏ trống = tất cả)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: pytest + E2E giao diện
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cài thư viện Python
        run: pip install -r requirements-dev.txt
      - name: pytest (backend, bộ máy Python so với JavaScript, Ollama giả, Whisper giả, fuzz, cấu hình di động)
        run: python -m pytest -q
      - name: Cài Playwright + Chromium
        working-directory: tests/e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: E2E giao diện (máy tính, 390px, bản độc lập mobile/www, nhận dạng giọng nói giả)
        env:
          E2E_OUT: ${{ runner.temp }}/e2e
          E2E_GREP: ${{ github.event.inputs.grep }}
        run: |
          if [ -n "$E2E_GREP" ]; then node tests/e2e/run.js --grep "$E2E_GREP"; else node tests/e2e/run.js; fi
      - name: Lưu ảnh chụp và log máy chủ
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/e2e
          retention-days: 5
          if-no-files-found: ignore
